<header class="border-b border-white/10 bg-slate-950/85 backdrop-blur-xl">
  <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8" aria-label="Main navigation">
    <a routerLink="/agent" class="group flex items-center gap-3 rounded-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-blue-700 to-purple-800 shadow-lg shadow-indigo-950/60 transition group-hover:scale-105"><img src="/bot-mark.svg" alt="" class="h-7 w-7" /></span>
      <span class="text-lg font-bold tracking-tight text-white">Cbot <span class="rounded-md bg-gradient-to-r from-blue-400 to-violet-400 bg-clip-text px-1 text-transparent">Agent</span></span>
    </a>
    <div class="order-3 flex w-full items-center gap-1 overflow-x-auto pb-1 sm:order-2 sm:w-auto sm:pb-0">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="bg-indigo-400/15 text-white ring-1 ring-indigo-300/20" [routerLinkActiveOptions]="{ exact: true }" class="whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">{{ link.label }}</a>
      }
    </div>
    <div class="order-2 flex items-center gap-2 sm:order-3">
      @if (auth.isLoggedIn()) {
        <span class="hidden max-w-32 truncate text-sm text-slate-400 md:block">{{ auth.userName() }}</span>
        <button type="button" (click)="auth.logout()" class="rounded-lg border border-white/10 px-3 py-2 text-sm font-semibold text-slate-200 transition hover:border-violet-400/50 hover:bg-violet-400/10 hover:text-white active:scale-[.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400">Log out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="bg-gradient-to-r from-blue-700 to-purple-800 text-white shadow-lg shadow-indigo-950/50" class="rounded-lg bg-gradient-to-r from-blue-700 to-purple-800 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-indigo-950/50 transition hover:from-blue-600 hover:to-purple-700 active:scale-[.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400">Log in</a>
      }
    </div>
  </nav>
</header>
