@if (mobileOpen()) {
  <button
    class="absolute inset-0 z-30 bg-black/60 md:hidden"
    type="button"
    aria-label="Close sidebar"
    (click)="closeSidebar.emit()"
  ></button>
}

<aside
  class="absolute inset-y-0 left-0 z-40 flex h-full min-h-0 w-[min(310px,calc(100vw-48px))] -translate-x-full flex-col overflow-hidden border-r border-blue-100/10 bg-[#0c1428] px-2.5 py-3.5 text-blue-50 transition-transform duration-200 md:relative md:inset-auto md:z-auto md:w-[300px] md:translate-x-0"
  [class.translate-x-0]="mobileOpen()"
  aria-label="Conversation history"
>
  <button
    class="flex w-full shrink-0 items-center gap-3 rounded-lg border border-transparent bg-transparent px-3 py-2.5 text-left text-xs font-medium text-blue-50 transition hover:bg-white/10"
    type="button"
    (click)="newConversation.emit()"
  >
    <svg class="h-[17px] w-[17px] shrink-0 fill-none stroke-blue-100/80 [stroke-linecap:round] [stroke-width:1.6]" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg>
    <span>New chat</span>
  </button>

  <section class="flex min-h-0 flex-1 flex-col pt-6" aria-label="Recent conversations">
    <h2 class="shrink-0 px-2.5 pb-2 text-[10px] font-semibold tracking-wide text-blue-100/70">Recent</h2>
    <div class="flex min-h-0 flex-1 flex-col gap-0.5 overflow-y-auto px-px [scrollbar-color:#3c3c43_transparent] [scrollbar-width:thin]">
      @for (conversation of conversations(); track conversation.id) {
        <div
          class="group flex w-full shrink-0 items-center gap-1 overflow-hidden rounded-lg px-1 transition hover:bg-blue-900/25"
          [ngClass]="conversation.id === activeConversationId() ? 'bg-[#060b18] ring-1 ring-inset ring-blue-300/25 shadow-md shadow-black/30' : ''"
        >
          <button
            class="flex min-w-0 flex-1 items-center gap-2.5 overflow-hidden border-0 bg-transparent px-1.5 py-[9px] text-left text-[15px] text-blue-100/85 transition hover:text-white"
            type="button"
            (click)="selectConversation.emit(conversation.id); closeSidebar.emit()"
            [attr.title]="conversation.title"
            [ngClass]="conversation.id === activeConversationId() ? 'text-white' : ''"
          >
            <svg class="h-[15px] w-[15px] shrink-0 fill-none stroke-current [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:1.3]" viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 4.5h13v9h-7l-4 3v-3h-2z" /></svg>
            <span class="overflow-hidden text-ellipsis whitespace-nowrap">{{ conversation.title }}</span>
          </button>
          <button
            class="grid h-7 w-7 shrink-0 place-items-center rounded-md text-blue-100/60 opacity-0 transition hover:bg-purple-300/15 hover:text-purple-100 focus:opacity-100 group-hover:opacity-100"
            type="button"
            [attr.aria-label]="'Delete conversation: ' + conversation.title"
            title="Delete conversation"
            (click)="deleteConversation.emit(conversation.id)"
          >
            <svg class="h-4 w-4 fill-none stroke-current [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:1.5]" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12m-10 0 .7 10h6.6L14 6M8 6V4h4v2m-3 3v4m2-4v4" /></svg>
          </button>
        </div>
      }
    </div>
  </section>
</aside>
